    <script>
      (function () {
        // Suppress Vite HMR WebSocket connection errors in AI Studio iframe environment
        window.addEventListener(
          'error',
          function (e) {
            const msg = (e && e.message) || '';
            const file = (e && e.filename) || '';
            if (
              msg.includes('WebSocket') ||
              msg.includes('closed without opened') ||
              file.includes('@vite/client')
            ) {
              e.preventDefault?.();
              e.stopImmediatePropagation?.();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            const reason = e && e.reason ? String(e.reason) : '';
            if (reason.includes('WebSocket') || reason.includes('closed without opened')) {
              e.preventDefault?.();
              e.stopImmediatePropagation?.();
            }
          },
          true
        );

        const NativeWS = window.WebSocket;
        if (!NativeWS) return;

        function ViteSafeWebSocket(url, protocols) {
          // Allow Socket.IO or non-Vite sockets to proceed with Native WebSocket
          const isVite =
            protocols === 'vite-hmr' ||
            (typeof url === 'string' &&
              (url.includes('vite') || url.includes('/@vite/client') || url.endsWith(':3000/')));

          if (isVite && protocols === 'vite-hmr') {
            // Emulate an open, silent event target so @vite/client never triggers close-before-open
            const listeners = {};
            const mock = {
              url: url,
              readyState: NativeWS.OPEN,
              bufferedAmount: 0,
              extensions: '',
              protocol: 'vite-hmr',
              binaryType: 'blob',
              addEventListener: function (type, fn) {
                listeners[type] = listeners[type] || [];
                listeners[type].push(fn);
              },
              removeEventListener: function (type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function (cb) { return cb !== fn; });
              },
              dispatchEvent: function () { return true; },
              send: function () {},
              close: function () {
                mock.readyState = NativeWS.CLOSED;
              },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
            };
            return mock;
          }

          try {
            const ws = new NativeWS(url, protocols);
            ws.addEventListener('error', function (err) {
              if (err && typeof err.stopImmediatePropagation === 'function') {
                err.stopImmediatePropagation();
              }
            });
            return ws;
          } catch {
            return {
              readyState: NativeWS.CLOSED,
              addEventListener: function () {},
              removeEventListener: function () {},
              send: function () {},
              close: function () {},
            };
          }
        }

        ViteSafeWebSocket.prototype = NativeWS.prototype;
        ViteSafeWebSocket.CONNECTING = NativeWS.CONNECTING;
        ViteSafeWebSocket.OPEN = NativeWS.OPEN;
        ViteSafeWebSocket.CLOSING = NativeWS.CLOSING;
        ViteSafeWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = ViteSafeWebSocket;
      })();
    </script>
